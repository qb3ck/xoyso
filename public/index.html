<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Geografía 1º ESO</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Inicio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 8c6 0 6 6 12 6s6 10 12 10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      <span>Geografía 1º ESO</span>
    </button>
    <div class="topbar-right">
      <button class="lang-btn" id="langBtn" aria-pressed="false" title="Show in English">EN</button>
      <div class="topbar-user" id="userArea" hidden>
        <span class="user-chip" id="userChip"></span>
        <button class="link-btn" id="logoutBtn"><span class="tr" data-es="Salir" data-en="Sign out" title="Sign out">Salir</span></button>
      </div>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
